<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleFeed</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topbar">
        <h1>StyleFeed</h1>
        <nav class="nav-links">
            <a href="saved.html">Saved</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <main class="feed">
        <section class="controls">
            <input id="search" type="search" placeholder="Search clothing..." aria-label="Search clothing">
            <select id="category" aria-label="Filter by category">
                <option value="all">All categories</option>
            </select>
            <select id="sort" aria-label="Sort products">
                <option value="featured">Featured</option>
                <option value="price-low-high">Price: low to high</option>
                <option value="price-high-low">Price: high to low</option>
                <option value="name-a-z">Name: A to Z</option>
            </select>
        </section>
        <p id="feed-message" class="feed-message"></p>
        <div id="feed"></div>
    </main>

    <script src="products.js"></script>
    <script src="catalog.js"></script>
    <script src="cart.js"></script>
    <script src="saved.js"></script>
    <script src="app.js"></script>
</body>

</html>
